<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:,">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HUST World - 华中科技大学校园模拟游戏</title>
    
    <!-- ===== HUST WORLD 统一 UI 主题 ===== -->
    <link rel="stylesheet" href="/game/css/ui-theme.css?v=1" />
    <link rel="stylesheet" href="/game/css/game-dashboard.css?v=1" />
    <link rel="stylesheet" href="/game/css/gameplay-panels.css?v=1" />
    <link rel="stylesheet" href="/game/css/responsive-motion.css?v=1" />
    <link rel="stylesheet" href="/game/css/campus-week.css?v=2" />
    <link rel="stylesheet" href="/game/css/newcomer-guide.css?v=1" />
    
    <!-- ===== 原始地图系统样式（100% 保留） ===== -->
    <link rel="stylesheet" href="/map/css/style.css?v=12" />
    
    <!-- ===== 开始界面样式 ===== -->
    <style>
        /* ========== 开始界面 ========== */
        .start-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 60000;
        background: url('assets/hust_campus.png') center/cover no-repeat;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        animation: start-screen-in 0.8s ease-out;
    }
        
        .start-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                135deg,
                rgba(10, 14, 39, 0.85) 0%,
                rgba(20, 26, 55, 0.75) 30%,
                rgba(30, 35, 65, 0.7) 50%,
                rgba(20, 26, 55, 0.75) 70%,
                rgba(10, 14, 39, 0.85) 100%
            );
            backdrop-filter: blur(4px);
        }
        
        .start-screen::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(67, 199, 214, 0.06) 0%, transparent 50%);
            animation: start-glow 4s ease-in-out infinite;
        }
        
        @keyframes start-screen-in {
            from {
                opacity: 0;
                transform: scale(1.05);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes start-glow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        .start-content {
            position: relative;
            z-index: 1;
            text-align: center;
            animation: start-content-in 1s ease-out 0.3s both;
        }
        
        @keyframes start-content-in {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .game-logo {
            width: 140px;
            height: 140px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
            border: 3px solid rgba(255, 215, 0, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 
                0 0 60px rgba(255, 215, 0, 0.25),
                inset 0 0 40px rgba(255, 215, 0, 0.1);
            animation: logo-float 3s ease-in-out infinite;
        }
        
        @keyframes logo-float {
            0%, 100% {
                transform: translateY(0) scale(1);
                box-shadow: 
                    0 0 60px rgba(255, 215, 0, 0.25),
                    inset 0 0 40px rgba(255, 215, 0, 0.1);
            }
            50% {
                transform: translateY(-10px) scale(1.02);
                box-shadow: 
                    0 0 80px rgba(255, 215, 0, 0.35),
                    inset 0 0 50px rgba(255, 215, 0, 0.15);
            }
        }
        
        .game-title {
            font-size: 72px;
            font-weight: 900;
            color: var(--hw-gold);
            text-shadow: 
                0 0 40px rgba(245, 197, 66, 0.45),
                0 4px 10px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(245, 197, 66, 0.25);
            letter-spacing: 12px;
            margin-bottom: 12px;
            font-family: var(--hw-font-serif);
            line-height: 1.1;
        }
        
        .game-subtitle {
            font-size: 16px;
            color: var(--hw-text-muted);
            letter-spacing: 8px;
            margin-bottom: 52px;
            font-family: var(--hw-font-sans);
        }
        
        .start-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            width: min(340px, 88vw);
        }
        
        .start-btn {
            width: 100%;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            font-family: var(--hw-font-sans);
        }
        
        .start-btn.continue {
            background: linear-gradient(135deg, var(--hw-gold), var(--hw-gold-dark));
            color: var(--hw-bg-dark);
            box-shadow: var(--hw-shadow-glow-gold);
        }
        
        .start-btn.continue:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 0 40px rgba(245, 197, 66, 0.4), 0 12px 24px rgba(0, 0, 0, 0.35);
        }
        
        .start-btn.new {
            background: rgba(255, 255, 255, 0.06);
            color: var(--hw-text);
            border: 1px solid var(--hw-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }
        
        .start-btn.new:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--hw-border-active);
            color: var(--hw-gold);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 0 24px rgba(245, 197, 66, 0.2), 0 12px 24px rgba(0, 0, 0, 0.35);
        }
        
        .start-btn:active {
            transform: translateY(-1px) scale(0.99);
        }
        
        .saved-info {
            margin-top: 8px;
            font-size: 13px;
            color: var(--hw-text-muted);
            letter-spacing: 0.5px;
            line-height: 1.6;
        }
        
        .saved-info strong {
            color: var(--hw-gold);
            font-weight: 600;
        }
        
        .start-status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
            font-size: 13px;
            color: var(--hw-text-muted);
        }
        
        .start-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--hw-text-muted);
            box-shadow: 0 0 6px currentColor;
        }
        
        .start-status-dot.guest {
            background: var(--hw-vivid-green);
            box-shadow: 0 0 8px rgba(0, 201, 167, 0.5);
        }
        
        .start-status-dot.logged-in {
            background: var(--hw-hust-blue-light);
            box-shadow: 0 0 8px rgba(30, 111, 223, 0.5);
        }
        
        .start-footer {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: var(--hw-text-muted);
            font-size: 12px;
            letter-spacing: 2px;
        }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            .game-logo {
                width: 100px;
                height: 100px;
                font-size: 60px;
            }
            
            .game-title {
                font-size: 36px;
                letter-spacing: 4px;
            }
            
            .game-subtitle {
                font-size: 14px;
                letter-spacing: 3px;
            }
            
            .start-btn {
                width: 240px;
                padding: 15px 30px;
                font-size: 16px;
            }
            
            .saved-info {
                font-size: 12px;
            }
        }
    </style>
    
    <!-- ===== 融合系统样式 ===== -->
    <style>
        /* ========== 全局变量 ========== */
        :root {
            --gold: #FFD700;
            --gold-light: #FFE55C;
            --gold-dark: #B8960F;
            --hust-blue: #0042ba;
            --hust-blue-deep: #061a46;
            --cyan: #43c7d6;
            --surface: rgba(20, 22, 40, 0.95);
            --border: rgba(255,255,255,0.08);
            --border-active: rgba(255,215,0,0.35);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
            --shadow-gold: 0 0 40px rgba(255,215,0,0.3);
        }
        
        /* ========== 加载屏幕 ========== */
        .loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 35%, rgba(67, 199, 214, 0.08), transparent 40%),
                radial-gradient(circle at 80% 65%, rgba(255, 215, 0, 0.06), transparent 40%),
                radial-gradient(ellipse at center, #141e30 0%, #0a0a16 70%);
            z-index: 50000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .loading-screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(45deg, transparent 48%, rgba(255,255,255,0.02) 50%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, rgba(255,255,255,0.02) 50%, transparent 52%);
            background-size: 60px 60px;
            animation: grid-move 20s linear infinite;
            pointer-events: none;
        }
        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        .loading-logo {
            width: 100px;
            height: 100px;
            border: 3px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin-bottom: 28px;
            box-shadow: 
                0 0 60px rgba(255,215,0,0.2),
                inset 0 0 30px rgba(255,215,0,0.1);
            animation: logo-float 3s ease-in-out infinite, logo-glow 2s ease-in-out infinite;
            position: relative;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
        }
        .loading-logo::after {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, var(--gold), transparent, var(--gold-light), transparent);
            animation: logo-rotate 4s linear infinite;
            opacity: 0.5;
            filter: blur(8px);
        }
        @keyframes logo-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.02); }
        }
        @keyframes logo-glow {
            0%, 100% { box-shadow: 0 0 60px rgba(255,215,0,0.2), inset 0 0 30px rgba(255,215,0,0.1); }
            50% { box-shadow: 0 0 80px rgba(255,215,0,0.35), inset 0 0 40px rgba(255,215,0,0.2); }
        }
        @keyframes logo-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-title {
            color: var(--gold);
            font-size: 48px;
            font-weight: 900;
            font-family: 'Microsoft YaHei', sans-serif;
            letter-spacing: 8px;
            margin-bottom: 8px;
            text-shadow: 
                0 0 40px rgba(255, 215, 0, 0.4),
                0 0 80px rgba(255, 215, 0, 0.2);
            animation: title-pulse 3s ease-in-out infinite;
            position: relative;
        }
        @keyframes title-pulse {
            0%, 100% { text-shadow: 0 0 40px rgba(255, 215, 0, 0.4), 0 0 80px rgba(255, 215, 0, 0.2); }
            50% { text-shadow: 0 0 60px rgba(255, 215, 0, 0.6), 0 0 120px rgba(255, 215, 0, 0.3); }
        }
        .loading-subtitle {
            color: #9ca3af;
            font-size: 15px;
            font-family: 'Microsoft YaHei', sans-serif;
            letter-spacing: 4px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(67, 199, 214, 0.3);
        }
        .loading-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        .loading-bar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: bar-sweep 2s ease-in-out infinite;
        }
        @keyframes bar-sweep {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }
        .loading-bar-fill {
            height: 100%;
            background: 
                linear-gradient(90deg, #B8960F, var(--gold), var(--gold-light), var(--gold), #B8960F);
            background-size: 300% 100%;
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            animation: bar-shimmer 3s linear infinite;
            box-shadow: 
                0 0 20px rgba(255,215,0,0.5),
                0 0 40px rgba(255,215,0,0.3);
            position: relative;
        }
        .loading-bar-fill::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 3px;
            height: 100%;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
        }
        @keyframes bar-shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        .loading-text {
            color: #6b7280;
            font-size: 13px;
            font-family: 'Microsoft YaHei', sans-serif;
            margin-top: 18px;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }
        
        /* ========== 角色创建面板 ========== */
        .character-creation-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.92);
            backdrop-filter: blur(12px) saturate(1.2);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: overlay-fade-in 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes overlay-fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .character-creation-panel {
            background: 
                linear-gradient(160deg, rgba(26, 29, 53, 0.95) 0%, rgba(18, 20, 42, 0.98) 40%, rgba(26, 29, 53, 0.95) 100%),
                radial-gradient(circle at 30% 20%, rgba(67, 199, 214, 0.05), transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(255, 215, 0, 0.04), transparent 40%);
            border: 1px solid rgba(255,215,0,0.12);
            border-radius: 28px;
            padding: 50px 46px 38px;
            width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            color: #e5e7eb;
            font-family: 'Microsoft YaHei', sans-serif;
            box-shadow: 
                0 30px 80px rgba(0,0,0,0.6),
                0 0 120px rgba(255,215,0,0.08),
                inset 0 1px 0 rgba(255,255,255,0.08);
            position: relative;
            animation: panel-slide-up 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes panel-slide-up {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .character-creation-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--cyan), var(--gold), transparent);
            border-radius: 28px 28px 0 0;
        }
        .character-creation-panel h2 {
            text-align: center;
            color: var(--gold);
            margin-bottom: 34px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(255,215,0,0.3);
            position: relative;
        }
        .character-creation-panel h2::after {
            content: '';
            position: absolute;
            bottom: -12px; left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .form-group {
            margin-bottom: 26px;
            position: relative;
        }
        .form-group label {
            display: block;
            color: #9ca3af;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px 16px;
            background: rgba(255,255,255,0.03);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #e5e7eb;
            font-size: 15px;
            font-family: 'Microsoft YaHei', sans-serif;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }
        .form-group input::placeholder {
            color: #4b5563;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--gold);
            background: rgba(255,215,0,0.03);
            box-shadow: 
                0 0 0 4px rgba(255,215,0,0.08),
                0 0 20px rgba(255,215,0,0.15);
            transform: translateY(-1px);
        }
        .form-group select option {
            background: #1a1d35;
            color: #e5e7eb;
        }
        .gender-buttons {
            display: flex;
            gap: 12px;
        }
        .gender-btn {
            flex: 1;
            padding: 15px;
            background: rgba(255,255,255,0.02);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #9ca3af;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .gender-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,215,0,0.08), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .gender-btn:hover {
            background: rgba(255,215,0,0.05);
            border-color: rgba(255,215,0,0.3);
            color: #e5e7eb;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,215,0,0.15);
        }
        .gender-btn:hover::before {
            opacity: 1;
        }
        .gender-btn.selected {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.05));
            border-color: var(--gold);
            color: var(--gold);
            font-weight: 700;
            box-shadow: 
                0 0 0 3px rgba(255,215,0,0.1),
                0 8px 24px rgba(255,215,0,0.2);
            transform: translateY(-2px);
        }
        .create-btn {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #D4A017, var(--gold), #D4A017);
            background-size: 200% 100%;
            color: #12142a;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 16px;
            letter-spacing: 1.5px;
            box-shadow: 
                0 6px 20px rgba(255,215,0,0.25),
                0 0 40px rgba(255,215,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .create-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; right: -100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        .create-btn:hover:not(:disabled)::before {
            left: 100%;
        }
        .create-btn:hover:not(:disabled) {
            background-position: 200% 0;
            transform: translateY(-3px);
            box-shadow: 
                0 10px 30px rgba(255,215,0,0.35),
                0 0 60px rgba(255,215,0,0.2);
        }
        .create-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }
        .create-btn:disabled {
            background: rgba(255,255,255,0.05);
            color: #4b5563;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            border: 1.5px solid rgba(255,255,255,0.05);
        }
        
        /* ========== 性格测试问答面板 ========== */
        .quiz-panel {
            display: none;
        }
        .quiz-panel.active {
            display: block;
            animation: quiz-fade-in 0.4s ease;
        }
        @keyframes quiz-fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .quiz-progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            margin-bottom: 22px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        .quiz-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
            background-size: 200% 100%;
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
            animation: progress-shimmer 2s linear infinite;
        }
        @keyframes progress-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .quiz-question {
            font-size: 16px;
            color: #e5e7eb;
            margin-bottom: 20px;
            line-height: 1.7;
            font-weight: 600;
            text-align: center;
            padding: 10px;
        }
        .quiz-option {
            display: block;
            width: 100%;
            padding: 16px 18px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.02);
            border: 1.5px solid rgba(255,255,255,0.08);

        /* ========== 战斗系统 · 主线战斗系统原版UI ========== */
        .battle-overlay {

        /* ========== 顶部信息栏 ========== */

        /* ========== 血条 ========== */
        .hp-bar-container {
            width: 150px; height: 24px;
            background: linear-gradient(180deg, #2D2D2D, #1A1A1A);
            border-radius: 15px; overflow: hidden;
            border: 3px solid #4CAF50;
            box-shadow: 
                0 4px 0 #2E7D32,
                0 6px 15px rgba(76, 175, 80, 0.3),
                inset 0 2px 4px rgba(255,255,255,0.1);
            position: relative;
        }
        .hp-bar-container::before {
            content: '';
            position: absolute; top: 2px; left: 5px; right: 5px; height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%);
            border-radius: 10px 10px 0 0;
            pointer-events: none;
        }
        .hp-bar {
            height: 100%;
            transition: width 0.5s ease;
            border-radius: 12px;
            position: relative; overflow: hidden;
        }
        .hp-bar::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 100%;
            background: repeating-linear-gradient(
                45deg, transparent, transparent 8px,
                rgba(255,255,255,0.1) 8px, rgba(255,255,255,0.1) 16px
            );
            animation: barShimmer 2s linear infinite;
        }
        @keyframes barShimmer {
            0% { transform: translateX(-16px); }
            100% { transform: translateX(16px); }
        }
        .hp-bar.player {
            background: linear-gradient(90deg, #2E7D32, #4CAF50, #66BB6A);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.2);
        }
        .hp-bar.enemy {
            background: linear-gradient(90deg, #C62828, #f44336, #EF5350);

        }
        .hp-bar-container.enemy-hp {
            border-color: #f44336;
            box-shadow: 
                0 4px 0 #C62828,
                0 6px 15px rgba(244, 67, 54, 0.3),
                inset 0 2px 4px rgba(255,255,255,0.1);
        }
        .hp-bar.low {
            animation: pulseRed 0.8s ease-in-out infinite;

            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }

        .hp-text {

            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); font-weight: bold;
        }

        /* ========== 熟练度条（替代智力条） ========== */
        .prof-bar-container {
            width: 150px; height: 20px;

        /* ========== 战斗场景区域 ========== */

        @keyframes buffAppear {

        .settlement-panel.lose .settlement-title { color: #f44336; }

        .reward-item {
            display: flex; justify-content: space-between; align-items: center;

        .reward-label { font-size: 16px; color: #ccc; }

        .continue-button {
            margin-top: 30px; padding: 15px 40px;
            border: none; border-radius: 10px;
            font-size: 20px; font-weight: bold; color: white; cursor: pointer;
            transition: all 0.3s;
        }
        .settlement-panel.win .continue-button { background: linear-gradient(135deg, #4CAF50, #388E3C); }
        .settlement-panel.lose .continue-button { background: linear-gradient(135deg, #666, #555); }
        .settlement-panel.flee .continue-button { background: linear-gradient(135deg, #FFD700, #FFA000); color: #333; }
        .continue-button:hover { transform: scale(1.05); }

        /* ========== 动画 ========== */
        @keyframes playerAttack {
            0% { transform: translateX(0); }
            30% { transform: translateX(50px); }
            50% { transform: translateX(80px); }
            100% { transform: translateX(0); }
        }
        .player-avatar.attack { animation: playerAttack 0.6s ease-in-out; }
        @keyframes enemyAttack {
            0% { transform: translateX(0); }
            30% { transform: translateX(-50px); }
            50% { transform: translateX(-80px); }
            100% { transform: translateX(0); }
        }
        .enemy-avatar.attack { animation: enemyAttack 0.6s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .enemy-avatar.hurt, .player-avatar.hurt { animation: shake 0.4s ease-in-out; }
        @keyframes critFlash {
            0%, 100% { filter: brightness(1) saturate(1); }
            50% { filter: brightness(2) saturate(1.5) drop-shadow(0 0 20px #FFD700); }
        }
        .enemy-avatar.critical, .player-avatar.critical {
            animation: critFlash 0.6s ease-in-out, shake 0.3s ease-in-out;
        }
        @keyframes healPulse {
            0% { box-shadow: 0 0 30px rgba(76,175,80,0.6); }
            50% { box-shadow: 0 0 60px rgba(76,175,80,1); }
            100% { box-shadow: 0 0 30px rgba(76,175,80,0.6); }
        }
        .player-avatar.buffed { animation: healPulse 1s ease-in-out; }

        /* 浮动伤害数字 */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            30% { opacity: 1; transform: translateY(-30px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
        }
        .battle-damage-float {
            position: absolute; font-weight: 900; font-size: 22px;
            pointer-events: none; z-index: 10;
            animation: floatUp 0.9s ease-out forwards;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .battle-damage-float.crit {
            font-size: 30px; color: #FFD700 !important;
            animation: floatUp 1.1s ease-out forwards;
        }
        .battle-damage-float.heal {
            font-size: 20px; color: #4ade80 !important;
            animation: floatUp 1s ease-out forwards;
        }

        /* 粒子特效 */
        .battle-particle {
            position: absolute; pointer-events: none; z-index: 11;

            animation: particle-rise 1.5s ease-out forwards;

        @keyframes particle-rise {

                    { text: '学习新技术/看技术博客', scores: { '计算机科学与技术学院': 3, '电气与电子工程学院': 1 } },
                    { text: '阅读商业/管理类书籍', scores: { '管理学院': 3 } },
                    { text: '拆装维修电子设备', scores: { '电气与电子工程学院': 3, '机械科学与工程学院': 2 } },
                    { text: '看时事评论/辩论节目', scores: { '法学院': 3 } },
                    { text: '动手制作模型/DIY', scores: { '机械科学与工程学院': 3 } }
                ]
            }
        ];
        
        const COLLEGES = [
            '计算机科学与技术学院',
            '管理学院',
            '电气与电子工程学院',
            '机械科学与工程学院',
            '法学院'
        ];
        
        let creationState = {
            selectedGender: '',
            characterName: '',
            quizAnswers: [],
            currentQuestion: 0,
            collegeScores: {}
        };
        
        function bindCreationEvents() {
            const nameInput = document.getElementById('char-name-input');
            const toQuizBtn = document.getElementById('to-quiz-btn');
            const skipAllBtn = document.getElementById('skip-all-btn');
            const genderBtns = document.querySelectorAll('.gender-btn');
            const stepBasic = document.getElementById('creation-step-basic');
            const stepQuiz = document.getElementById('creation-step-quiz');
            const stepResult = document.getElementById('creation-step-result');
            
            // 性别选择
            genderBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    genderBtns.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    creationState.selectedGender = btn.dataset.gender;
                    validateBasicForm();
                });
            });
            
            // 表单验证
            function validateBasicForm() {
                const name = nameInput.value.trim();
                const valid = name.length >= 2 && name.length <= 10 && creationState.selectedGender;
                toQuizBtn.disabled = !valid;
            }
            
            nameInput.addEventListener('input', validateBasicForm);
            
            // 进入问答
            toQuizBtn.addEventListener('click', () => {
                creationState.characterName = nameInput.value.trim();
                creationState.collegeScores = {};
                COLLEGES.forEach(c => creationState.collegeScores[c] = 0);
                creationState.currentQuestion = 0;
                creationState.quizAnswers = [];
                
                stepBasic.style.display = 'none';
                stepQuiz.classList.add('active');
                showQuestion(0);
            });
            
            // 跳过全部
            skipAllBtn.addEventListener('click', () => {
                hideCharacterCreation();
                initGameWithCharacter({
                    characterName: 'HUST新生',
                    gender: 'male',
                    college: '计算机科学与技术学院'
                });
            });
            
            function showQuestion(index) {
                if (index >= PERSONALITY_QUESTIONS.length) {
                    showResults();
                    return;
                }
                const q = PERSONALITY_QUESTIONS[index];
                const total = PERSONALITY_QUESTIONS.length;
                
                document.getElementById('quiz-progress-fill').style.width = ((index / total) * 100) + '%';
                document.getElementById('quiz-question-text').textContent = 
                    `第 ${index + 1}/${total} 题：${q.question}`;
                
                const optionsContainer = document.getElementById('quiz-options-container');
                optionsContainer.innerHTML = '';
                
                q.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option';
                    btn.textContent = String.fromCharCode(65 + i) + '. ' + opt.text;
                    btn.addEventListener('click', () => {
                        // 记录得分
                        creationState.quizAnswers.push(i);
                        for (const [college, score] of Object.entries(opt.scores)) {
                            creationState.collegeScores[college] = 
                                (creationState.collegeScores[college] || 0) + score;
                        }
                        creationState.currentQuestion++;
                        showQuestion(creationState.currentQuestion);
                    });
                    optionsContainer.appendChild(btn);
                });
            }
            
            function showResults() {
                stepQuiz.classList.remove('active');
                stepResult.classList.add('active');
                
                document.getElementById('quiz-progress-fill').style.width = '100%';
                
                // 排序学院得分
                const sorted = Object.entries(creationState.collegeScores)
                    .sort((a, b) => b[1] - a[1]);
                const bestCollege = sorted[0][0];
                const maxScore = sorted[0][1];
                
                let starsHtml = sorted.map(([college, score]) => {
                    const stars = Math.round((score / maxScore) * 5);
                    const starStr = '★'.repeat(stars) + '☆'.repeat(5 - stars);
                    const isBest = college === bestCollege;
                    return `<div class="quiz-score-row" style="${isBest ? 'border:1px solid rgba(255,215,0,0.2);' : ''}">
                        <span class="quiz-score-name" style="${isBest ? 'color:var(--gold);font-weight:600;' : ''}">${college}</span>
                        <span class="quiz-score-stars">${starStr}</span>
                    </div>`;
                }).join('');
                
                document.getElementById('quiz-result-content').innerHTML = `
                    <h3>📊 测试结果</h3>
                    ${starsHtml}
                    <div class="quiz-recommend">
                        🎯 推荐学院：${bestCollege}
                    </div>
                    <div style="margin-top:16px;display:flex;gap:10px;">
                        <button id="confirm-college-btn" style="
                            flex:1;padding:13px;
                            background:linear-gradient(135deg,#D4A017,var(--gold));
                            color:#12142a;border:none;border-radius:10px;
                            font-size:15px;font-weight:700;cursor:pointer;
                            letter-spacing:1px;box-shadow:0 4px 16px rgba(255,215,0,0.2);
                        ">✅ 选择 ${bestCollege}</button>
                        <button id="manual-college-btn" style="
                            padding:13px 20px;
                            background:rgba(255,255,255,0.04);
                            color:#9ca3af;border:1px solid rgba(255,255,255,0.08);
                            border-radius:10px;font-size:14px;cursor:pointer;
                        ">手动选择</button>
                    </div>
                `;
                
                document.getElementById('confirm-college-btn').addEventListener('click', () => {
                    finishCreation(bestCollege);
                });
                
                document.getElementById('manual-college-btn').addEventListener('click', () => {
                    // 显示手动选择
                    const resultDiv = document.getElementById('quiz-result-content');
                    resultDiv.innerHTML = `
                        <h3>🎓 手动选择学院</h3>
                        <div style="text-align:left;margin-top:12px;">
                            ${COLLEGES.map(c => `
                                <button class="quiz-option manual-college-opt" data-college="${c}">
                                    ${c} ${creationState.collegeScores[c] > 0 ? '(' + creationState.collegeScores[c] + '分)' : ''}
                                </button>
                            `).join('')}
                        </div>
                    `;
                    document.querySelectorAll('.manual-college-opt').forEach(btn => {
                        btn.addEventListener('click', () => {
                            finishCreation(btn.dataset.college);
                        });
                    });
                });
            }
            
            function finishCreation(college) {
                const characterData = {
                    characterName: creationState.characterName,
                    gender: creationState.selectedGender,
                    college: college,
                    quizAnswers: creationState.quizAnswers,
                    collegeScores: creationState.collegeScores
                };
                
                hideCharacterCreation();
                initGameWithCharacter(characterData, null, true);
            }
        }
        
        // ==================== 游戏初始化 ====================
        
        async function initGameWithCharacter(characterData, savedTime = null, shouldCreateRemoteCharacter = false) {
            updateLoading(70, '正在初始化任务系统...');
            
            // 登录用户创建角色时，先同步到后端并保存当前 characterId
            if (shouldCreateRemoteCharacter && typeof sessionManager !== 'undefined' && sessionManager.isLoggedIn()) {
                try {
                    const created = await authSystem.createCharacter(
                        characterData.characterName,
                        characterData.gender,
                        characterData.college
                    );
                    if (created) {
                        characterData = {
                            ...characterData,
                            characterId: created.characterId
                        };
                    }
                } catch (error) {
                    console.warn('[初始化] 后端角色创建失败，继续本地游戏:', error.message);
                }
            }
            
            try {
                // 检查地图系统是否已加载
                await waitForMapSystem();
                updateLoading(80, '正在初始化时间系统...');
                
                // 初始化时间系统
                if (!savedTime) {
                  savedTime = window.timeSystem.loadTime();
                }
                window.timeSystem.init(savedTime);
                
                // 等待questTriggerManager被暴露到window上后,传给时间系统
                const waitForQuestManager = setInterval(() => {
                  if (window.questTriggerManager) {
                    clearInterval(waitForQuestManager);
                    window.timeSystem.setQuestManager(window.questTriggerManager);
                    window.questTriggerManager.setGameTime(window.timeSystem.gameTime);
                  }
                }, 100);
                
                // 订阅时间事件
                window.timeSystem.subscribe('dayChange', (event, data) => {
                    console.log('[时间系统] 新的一天开始了:', data.weekday);
                    // 显示今日推荐活动
                    if (window.getTimeEvents) {
                        const activities = window.getTimeEvents.getRecommendedActivities(data.time);
                        if (activities.length > 0 && window.questTriggerUI) {
                            window.questTriggerUI._showToast(`📅 今日推荐：${activities[0]}`, '#4CAF50', 4000);
                        }
                    }
                });
                
                window.timeSystem.subscribe('periodChange', (event, data) => {
                    console.log('[时间系统] 时间段变化:', data.period);
                    // 显示时间段提示
                    if (window.getTimeEvents) {
                        const message = window.getTimeEvents.getPeriodMessage(data.period);
                        if (window.questTriggerUI) {
                            window.questTriggerUI._showToast(`🌤️ ${message}`, '#2196F3', 3000);
                        }
                    }
                });
                
                window.timeSystem.subscribe('hourChange', (event, data) => {
                    console.log('[时间系统] 整点:', data.hour);
                    // 检查课程和食堂状态
                    if (window.getTimeEvents) {
                        const time = window.timeSystem.getTime();
                        
                        // 检查上课
                        const currentClass = window.getTimeEvents.getClassAtTime(time);
                        if (currentClass && window.questTriggerUI) {
                            window.questTriggerUI._showToast(`📚 ${currentClass.name}开始了！`, '#FF9800', 4000);
                        }
                        
                        // 检查食堂
                        const canteenStatus = window.getTimeEvents.getCanteenStatus(time);
                        if (canteenStatus.open && canteenStatus.meal && window.questTriggerUI) {
                            if (data.hour === canteenStatus.meal.start) {
                                window.questTriggerUI._showToast(`🍽️ ${canteenStatus.meal.name}到了！`, '#4CAF50', 3000);
                            }
                        }
                    }
                });
                
                window.timeSystem.subscribe('semesterStart', (event, data) => {
                    if (window.questTriggerUI) {
                        window.questTriggerUI._showToast(`🎓 第${data.semester}学期开始了！新的学期加油！`, '#FFD700', 5000);
                    }
                });
                
                window.timeSystem.subscribe('midterm', (event, data) => {
                    if (window.questTriggerUI) {
                        window.questTriggerUI._showToast(`📝 期中周到了，好好复习！`, '#FF5722', 5000);
                    }
                });
                
                window.timeSystem.subscribe('finalWeek', (event, data) => {
                    if (window.questTriggerUI) {
                        window.questTriggerUI._showToast(`💯 期末周到了，全力以赴！`, '#E91E63', 5000);
                    }
                });
                
                window.timeSystem.subscribe('semesterEnd', (event, data) => {
                    if (window.questTriggerUI) {
                        window.questTriggerUI._showToast(`🎉 第${data.semester}学期结束了！假期快乐！`, '#4CAF50', 5000);
                    }
                });
                
                updateLoading(90, '正在融合系统...');
                
                // 初始化融合系统
                await fusionSystem.init({ characterData });
                fusionSystem.createCharacter(characterData);
                
                updateLoading(100, '初始化完成！');
                
                // 短暂延迟后隐藏加载屏幕
                setTimeout(async () => {
                    hideLoading();
                    showWelcomeNotification(characterData.characterName);
                    
                    // 保存初始快照
                    try {
                        if (typeof saveManager !== 'undefined') {
                            await saveManager.save();
                            console.log('[存档系统] 初始快照已保存');
                        }
                    } catch (error) {
                        console.warn('[存档系统] 初始快照保存失败:', error.message);
                    }
                    
                    // 启动自动保存
                    startAutoSave();
                    
                    // 初始化游戏主界面 UI
                    if (typeof window !== 'undefined' && window.GameDashboardUI) {
                        window.gameDashboardUI = window.GameDashboardUI.init();
                    }
                    if (typeof window !== 'undefined' && window.CampusWeekManager) {
                        window.CampusWeekManager.init();
                    }
                    if (typeof window !== 'undefined' && window.NewcomerGuide) {
                        window.NewcomerGuide.init();
                    }
                }, 800);
                
            } catch (error) {
                console.error('[初始化] 融合系统初始化失败:', error);
                loadingText.textContent = '初始化失败，请刷新页面重试';
                loadingText.style.color = '#FF5252';
            }
        }
        
        // ==================== 自动保存 ====================
        
        let autoSaveInterval = null;
        
        function startAutoSave() {
            if (typeof saveManager !== 'undefined') {
                saveManager.startAutoSave();
            } else {
                // 兜底：每30秒自动保存一次
                autoSaveInterval = setInterval(() => {
                    saveGame();
                }, 30000);
            }
            
            console.log('[存档系统] 自动保存已启动');
        }
        
        async function saveGame() {
            try {
                // 保存时间（兼容旧时间系统）
                if (window.timeSystem && typeof window.timeSystem.saveTime === 'function') {
                    window.timeSystem.saveTime();
                }
                
                // 统一存档
                if (typeof saveManager !== 'undefined') {
                    await saveManager.save();
                }
                
                console.log('[存档系统] 游戏已保存');
            } catch (e) {
                console.error('[存档系统] 保存失败:', e);
            }
        }
        
        function waitForMapSystem(timeout = 15000) {
            return new Promise((resolve, reject) => {
                const startTime = Date.now();
                
                const check = () => {
                    // 检查地图系统的关键模块是否可用
                    const mapReady = (
                        typeof window._eventBus !== 'undefined' &&
                        typeof window._character !== 'undefined' &&
                        typeof window._mapData !== 'undefined'
                    );
                    
                    if (mapReady) {
                        resolve();
                        return;
                    }
                    
                    if (Date.now() - startTime > timeout) {
                        reject(new Error('地图系统加载超时'));
                        return;
                    }
                    
                    updateLoading(30 + Math.min(30, (Date.now() - startTime) / timeout * 30), '等待地图系统就绪...');
                    setTimeout(check, 200);
                };
                
                check();
            });
        }
        
        function showWelcomeNotification(name) {
            // 使用融合系统的 Toast 显示欢迎信息
            setTimeout(() => {
                if (window.questTriggerUI && window.questTriggerUI._showToast) {
                    window.questTriggerUI._showToast(`🎓 欢迎来到 HUST World，${name}！`, '#FFD700', 5000);
                }
            }, 1500);
        }

        function refreshStartScreen() {
            const isLoggedIn = typeof sessionManager !== 'undefined' && sessionManager.isLoggedIn();
            const hasChars = isLoggedIn && sessionManager.hasCharacters();
            const hasLocalSave = !!loadSavedCharacter();
            
            const btnContinue = document.getElementById('btn-continue');
            const btnCharacterSelect = document.getElementById('btn-character-select');
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');
            const btnNewGame = document.getElementById('btn-new-game');
            const savedInfo = document.getElementById('saved-info');
            const statusRow = document.getElementById('start-status-row');
            const statusDot = document.getElementById('start-status-dot');
            const statusText = document.getElementById('start-status-text');
            
            // 默认隐藏
            btnContinue.style.display = 'none';
            btnCharacterSelect.style.display = 'none';
            btnLogin.style.display = 'none';
            btnLogout.style.display = 'none';
            savedInfo.style.display = 'none';
            statusRow.style.display = 'none';
            
            if (isLoggedIn) {
                btnLogout.style.display = 'block';
                statusRow.style.display = 'flex';
                statusDot.className = 'start-status-dot logged-in';
                
                if (hasChars) {
                    btnCharacterSelect.style.display = 'block';
                    const currentChar = sessionManager.getCurrentCharacter();
                    if (currentChar) {
                        btnContinue.style.display = 'block';
                        savedInfo.style.display = 'block';
                        savedInfo.innerHTML = `
                            <strong>当前角色</strong>：${currentChar.characterName} · ${currentChar.college || '未知学院'}
                            ${currentChar.level ? ` · Lv.${currentChar.level}` : ''}
                        `;
                        statusText.textContent = '已登录 · 有角色';
                    } else {
                        statusText.textContent = '已登录 · 请选择角色';
                    }
                    btnNewGame.textContent = '开始游戏';
                } else {
                    statusText.textContent = '已登录 · 无角色';
                    btnNewGame.textContent = '创建角色';
                }
            } else {
                btnLogin.style.display = 'block';
                statusRow.style.display = 'flex';
                statusDot.className = 'start-status-dot guest';
                btnNewGame.textContent = '开始游戏';
                
                if (hasLocalSave) {
                    btnContinue.style.display = 'block';
                    savedInfo.style.display = 'block';
                    const save = saveManager.loadLocal();
                    const charName = save?.character?.characterName || '游客';
                    const day = save?.gameTime?.day ? ` · 第 ${save.gameTime.day} 天` : '';
                    const semester = save?.character?.semester ? ` · ${formatSemesterForDisplay(save.character.grade, save.character.semester)}` : '';
                    savedInfo.innerHTML = `
                        <strong>本地游客存档</strong>：${charName}${semester}${day}
                        ${save?.character?.level ? ` · Lv.${save.character.level}` : ''}
                    `;
                    statusText.textContent = '游客模式 · 有存档';
                } else {
                    statusText.textContent = '游客模式 · 无存档';
                }
            }
        }
        
        function formatSemesterForDisplay(grade, semester) {
            const gradeMap = { 1: '大一', 2: '大二', 3: '大三', 4: '大四' };
            const semMap = { 1: '上', 2: '下' };
            return `${gradeMap[grade] || '大一'}${semMap[semester] || '上'}`;
        }
        
        // ==================== 启动流程 ====================
        
        (async function startGame() {
            console.log('============================================');
            console.log('  HUST World - 融合系统启动中...');
            console.log('  地图系统 + 主线战斗系统');
            console.log('============================================');
            
            // 先隐藏加载屏幕,显示开始界面
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.display = 'none';
            
            const startScreen = document.getElementById('start-screen');
            const btnContinue = document.getElementById('btn-continue');
            const btnNewGame = document.getElementById('btn-new-game');
            const btnCharacterSelect = document.getElementById('btn-character-select');
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');
            const savedInfo = document.getElementById('saved-info');
            
            // 刷新开始界面按钮状态
            refreshStartScreen();
            
            // 绑定事件
            btnNewGame.addEventListener('click', () => {
                if (typeof sessionManager !== 'undefined' && sessionManager.isLoggedIn() && !sessionManager.hasCharacters()) {
                    // 登录但无角色：引导创建角色
                    startNewGame();
                } else {
                    startNewGame();
                }
            });
            
            btnContinue.addEventListener('click', async () => {
                const isLoggedIn = typeof sessionManager !== 'undefined' && sessionManager.isLoggedIn();
                if (isLoggedIn) {
                    const character = sessionManager.getCurrentCharacter();
                    if (character) {
                        await continueGame(character, null);
                    }
                } else {
                    const savedCharacter = loadSavedCharacter();
                    const savedTime = loadSavedTime();
                    await continueGame(savedCharacter, savedTime);
                }
            });
            
            btnCharacterSelect.addEventListener('click', () => {
                showCharacterSelectPanel();
            });
            
            btnLogin.addEventListener('click', () => {
                showLoginPanel();
            });
            
            btnLogout.addEventListener('click', () => {
                if (confirm('退出登录后仍可继续使用本地游客存档，确定退出？')) {
                    authSystem.logout();
                    refreshStartScreen();
                }
            });
            
            // 按任意键开始游戏：优先继续（登录用户继续当前角色，游客继续本地）
            document.addEventListener('keydown', async function startOnKey(e) {
                const isLoggedIn = typeof sessionManager !== 'undefined' && sessionManager.isLoggedIn();
                if (isLoggedIn && sessionManager.getCurrentCharacter()) {
                    await continueGame(sessionManager.getCurrentCharacter(), null);
                } else if (loadSavedCharacter()) {
                    const savedCharacter = loadSavedCharacter();
                    const savedTime = loadSavedTime();
                    await continueGame(savedCharacter, savedTime);
                } else {
                    startNewGame();
                }
                document.removeEventListener('keydown', startOnKey);
            }, { once: true });
            
            // 点击屏幕开始游戏
            startScreen.addEventListener('click', async function startOnClick(e) {
                if (e.target.tagName !== 'BUTTON') {
                    const isLoggedIn = typeof sessionManager !== 'undefined' && sessionManager.isLoggedIn();
                    if (isLoggedIn && sessionManager.getCurrentCharacter()) {
                        await continueGame(sessionManager.getCurrentCharacter(), null);
                    } else if (loadSavedCharacter()) {
                        const savedCharacter = loadSavedCharacter();
                        const savedTime = loadSavedTime();
                        await continueGame(savedCharacter, savedTime);
                    } else {
                        startNewGame();
                    }
                }
            }, { once: true });
        })();
        
        function startNewGame() {
            console.log('[启动] 开始新游戏');
            
            const isLoggedIn = typeof sessionManager !== 'undefined' && sessionManager.isLoggedIn();
            
            // 仅清理当前本地存档数据，保留登录 token/user/角色/当前角色
            try {
                if (typeof saveManager !== 'undefined') {
                    saveManager.resetLocal();
                } else {
                    localStorage.removeItem('hust_world_save_v1');
                    localStorage.removeItem('hust_world_time');
                    localStorage.removeItem('hust_world_module_clubs');
                    localStorage.removeItem('hust_world_module_exploration');
                }
            } catch (e) {}
            
            // 游客模式直接重置当前角色；登录模式保留角色选择
            if (!isLoggedIn && typeof sessionManager !== 'undefined') {
                sessionManager.clearCurrentCharacterId();
            }
            
            // 隐藏开始界面,显示加载屏幕
            const startScreen = document.getElementById('start-screen');
            const loadingScreen = document.getElementById('loading-screen');
            
            if (!startScreen || !loadingScreen) {
                console.error('[启动] 找不到必要的DOM元素');
                return;
            }
            
            startScreen.style.display = 'none';
            loadingScreen.style.display = 'flex';
            
            updateLoading(10, '正在初始化引擎...');
            
            // 等待地图系统加载,然后显示角色创建
            waitForMapSystem(20000).then(() => {
                updateLoading(50, '地图加载完成，请创建角色');
                setTimeout(() => {
                    hideLoading();
                    showCharacterCreation();
                }, 500);
            }).catch(err => {
                console.error(err);
                updateLoading(50, '地图加载失败，请刷新页面');
                const loadingText = document.getElementById('loading-text');
                if (loadingText) {
                    loadingText.style.color = '#FF5252';
                }
            });
        }
        
        async function continueGame(savedCharacter, savedTime) {
            console.log('[启动] 继续游戏:', savedCharacter ? savedCharacter.characterName : '未知角色');
            
            // 隐藏开始界面,显示加载屏幕
            const startScreen = document.getElementById('start-screen');
            const loadingScreen = document.getElementById('loading-screen');
            
            startScreen.style.display = 'none';
            loadingScreen.style.display = 'flex';
            
            updateLoading(10, '正在初始化引擎...');
            
            // 加载统一存档并应用
            let save = null;
            try {
                if (typeof saveManager !== 'undefined') {
                    save = await saveManager.load();
                    if (save && save.character) {
                        savedCharacter = save.character;
                        savedTime = save.gameTime;
                    }
                }
            } catch (error) {
                console.warn('[启动] 加载存档失败，使用本地缓存:', error.message);
            }
            
            // 启动游戏,加载存档
            await initGameWithCharacter(savedCharacter, savedTime);
            
            // 应用快照中的位置、时间等
            if (save && typeof saveManager !== 'undefined') {
                saveManager.applySnapshot(save);
            }
        }
        
        function loadSavedCharacter() {
            if (typeof saveManager === 'undefined') return null;
            saveManager.ensureMigration();
            const save = saveManager.loadLocal();
            return save && save.character ? save.character : null;
        }
        
        function loadSavedTime() {
            if (typeof saveManager === 'undefined') return null;
            const save = saveManager.loadLocal();
            return save && save.gameTime ? save.gameTime : null;
        }
        
        // ==================== 键盘快捷键提示 ====================
        
        console.log(`
        ============================================
        🎮 操作指南：
          WASD / 方向键 - 移动角色
          Shift - 加速移动
          鼠标拖拽 - 平移地图
          滚轮 - 缩放地图
          点击地图 - 自动寻路到该点
          E 键 - 触发任务 / 与NPC对话 / 乘坐巴士
          F 键 - 探索打卡
          R 键 - 跑酷小游戏（靠近操场时）
          J 键 - 打开/关闭任务日志
          Esc - 关闭面板
        ============================================
        `);
    </script>
</body>
