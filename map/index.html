<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HUST WORLD · 校园地图</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="../game/css/ui-theme.css">
  <link rel="stylesheet" href="../game/css/responsive-motion.css">
  <style>
    :root {
      --map-gold: #F5C542;
      --map-bg: #101828;
      --map-card: rgba(30, 41, 59, 0.95);
      --map-text: #e5e7eb;
      --map-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--map-bg);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #ui-layer * {
      pointer-events: auto;
    }

    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 280px;
      max-width: calc(100vw - 120px);
      padding: 14px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(245, 197, 66, 0.25);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.48);
      z-index: 20;
      pointer-events: auto;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--map-gold);
      margin-bottom: 10px;
      letter-spacing: 1px;
      display: none;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      font-size: 13px;
      color: var(--map-text);
    }

    .hud-row:last-child {
      border-bottom: none;
    }

    .hud-label {
      color: var(--map-muted);
      font-size: 12px;
      flex-shrink: 0;
    }

    .hud-val {
      color: var(--map-text);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
      min-width: 0;
    }

    .hud-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
    }

    .hud-actions .hw-button {
      min-width: 36px;
      min-height: 36px;
      padding: 8px 10px;
      font-size: 15px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #sidePanel {
      position: fixed;
      top: 0;
      right: 0;
      width: 360px;
      max-width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.97);
      border-left: 1px solid rgba(245, 197, 66, 0.2);
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.45);
      z-index: 30;
      padding: 20px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
    }

    #sidePanel.open {
      transform: translateX(0);
    }

    #panelToggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      z-index: 40;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(245, 197, 66, 0.25);
      color: var(--map-gold);
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    #panelToggle.active::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      border: 2px solid var(--map-gold);
      pointer-events: none;
    }

    #miniToolbar {
      position: fixed;
      right: 16px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
      pointer-events: auto;
    }

    .mini-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(245, 197, 66, 0.25);
      background: rgba(15, 23, 42, 0.92);
      color: var(--map-text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .mini-btn:active {
      transform: scale(0.94);
      background: rgba(30, 41, 59, 0.95);
    }

    .mini-btn.on {
      background: rgba(245, 197, 66, 0.18);
      color: var(--map-gold);
      border-color: rgba(245, 197, 66, 0.55);
    }

    #locList {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .loc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.1);
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .loc-item:hover,
    .loc-item.sel {
      background: rgba(245, 197, 66, 0.12);
      border-color: rgba(245, 197, 66, 0.35);
    }

    .loc-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .loc-name {
      flex: 1;
      font-size: 14px;
      color: var(--map-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loc-type {
      font-size: 12px;
      color: var(--map-muted);
      flex-shrink: 0;
    }

    .type-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      margin-bottom: 12px;
    }

    .type-tag {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--map-text);
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .type-tag.active,
    .type-tag:hover {
      background: rgba(245, 197, 66, 0.15);
      border-color: var(--map-gold);
      color: var(--map-gold);
    }

    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--map-muted);
    }

    #legend i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      vertical-align: middle;
    }

    #selInfo {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.1);
      font-size: 13px;
      line-height: 1.6;
      color: var(--map-text);
      min-height: 60px;
    }

    #busOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      padding: 20px;
    }

    #busOverlay.show {
      display: flex;
    }

    #busPanel {
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(245, 197, 66, 0.25);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
      color: var(--map-text);
      position: relative;
    }

    .bus-panel-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--map-text);
      cursor: pointer;
    }

    .bus-route-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .route-name {
      font-weight: 700;
      color: var(--map-gold);
    }

    .route-price {
      font-size: 13px;
      color: var(--map-muted);
    }

    .bus-route-stops {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .bus-stop-btn {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(30, 41, 59, 0.8);
      color: var(--map-text);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .bus-stop-btn:hover {
      background: rgba(245, 197, 66, 0.15);
      border-color: var(--map-gold);
    }

    .bus-stop-btn.current {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .bus-stop-arrow {
      color: var(--map-muted);
      font-size: 12px;
    }

    .quest-poi-panel .hw-card,
    .hw-card {
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .poi-section .hw-card,
    .poi-npc-card,
    .poi-quest-card,
    .scene-task-card,
    .scene-npc-card {
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .poi-action-btn,
    .scene-action-btn,
    .scene-npc-btn,
    .scene-module-btn {
      white-space: nowrap;
    }

    #quest-map-prompt {
      max-width: min(480px, 92vw);
      text-align: center;
      pointer-events: none;
    }

    #npc-map-marker-layer .npc-map-marker:hover .npc-map-tooltip {
      opacity: 1 !important;
    }

    #map-scene-overlay .hw-card {
      background: rgba(30, 41, 59, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .subtitle {
      color: var(--map-muted);
      font-size: 13px;
      margin-bottom: 16px;
    }

    #selTitle {
      font-size: 16px;
      font-weight: 700;
      color: var(--map-text);
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {
      #hud {
        width: 220px;
        max-width: calc(100vw - 90px);
        padding: 10px;
        top: 10px;
        left: 10px;
      }

      .hud-row.hud-mobile-hide {
        display: none;
      }

      .hud-row {
        font-size: 12px;
        padding: 4px 0;
      }

      .hud-actions .hw-button {
        min-width: 32px;
        min-height: 32px;
        padding: 6px 8px;
        font-size: 14px;
      }

      #sidePanel {
        width: 100vw;
        padding: 16px;
        padding-bottom: 90px;
      }

      #panelToggle {
        top: 10px;
        right: 10px;
        width: 38px;
        height: 38px;
      }

      #miniToolbar {
        right: 10px;
        bottom: 80px;
      }

      .mini-btn {
        width: 40px;
        height: 40px;
      }

      #busPanel {
        padding: 18px;
      }

      .quest-poi-panel {
        width: 96%;
        max-height: 78vh;
        padding: 18px;
      }
    }

    @media (max-width: 480px) {
      #hud {
        width: 190px;
      }

      .hud-actions .hw-button {
        min-width: 30px;
        min-height: 30px;
        padding: 5px 7px;
        font-size: 13px;
      }

      .hud-title {
        display: none;
      }

      #miniToolbar {
        bottom: 70px;
      }
    }
  </style>
  <link rel="stylesheet" href="../game/css/cinematic-polish.css?v=1">
</head>

<body class="hw-map-page">
  <canvas id="gameCanvas"></canvas>
  <div id="ui-layer">
    <div id="hud" class="hw-panel"></div>

    <button id="panelToggle" aria-label="地点列表">☰</button>

    <div id="sidePanel" class="hw-panel">
      <h3 style="color:var(--map-gold);margin-bottom:4px;">地点列表</h3>
      <p class="subtitle">选择类型过滤，点击地点跳转</p>
      <div id="typeTags" class="type-tags"></div>
      <div id="legend"></div>
      <div id="selTitle">点击地图选择位置</div>
      <div id="selInfo">点击地图标记查看详情</div>
      <div id="locList"></div>
    </div>

    <div id="miniToolbar">
      <button id="btnZoomIn" class="mini-btn" title="放大">+</button>
      <button id="btnZoomOut" class="mini-btn" title="缩小">−</button>
      <button id="btnCollision" class="mini-btn" title="显示碰撞箱">碰撞</button>
      <button id="btnLabels" class="mini-btn" title="显示标签">标签</button>
      <button id="btnReset" class="mini-btn" title="重置视角">重置</button>
    </div>

    <div id="busOverlay">
      <div id="busPanel" class="hw-panel"></div>
    </div>
  </div>

  <!-- 游戏通用依赖 -->
  <script type="module" src="../game/js/core/SaveManager.js"></script>
  <script type="module" src="../game/js/core/SessionManager.js"></script>
  <script type="module" src="../game/js/managers/QuestTriggerManager.js"></script>
  <script type="module" src="../game/js/ui/QuestTriggerUI.js"></script>
  <script type="module" src="../game/js/ui/UIFeedback.js"></script>

  <!-- 地图模块 -->
  <script type="module" src="js/main.js"></script>
</body>

</html>
