<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPC 档案 | HUST WORLD</title>
  <link rel="stylesheet" href="/game/css/ui-theme.css">
  <link rel="stylesheet" href="/game/css/responsive-motion.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', Arial, sans-serif; margin: 0; padding: 20px; background: #f5f7fa; color: #333; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    h2 { font-size: 18px; margin-top: 24px; margin-bottom: 12px; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    button { padding: 8px 14px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; }
    button:hover { background: #eef; border-color: #667eea; }
    select, input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; }
    .panel { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; background: #fafafa; }
    .card h3 { margin: 0 0 6px 0; font-size: 15px; }
    .card p { margin: 0; font-size: 13px; color: #64748b; }
    .card .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .log { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; min-height: 120px; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
    .progress { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; font-family: Consolas, monospace; font-size: 12px; max-height: 200px; overflow-y: auto; }
  </style>
  <link rel="stylesheet" href="/game/css/cinematic-polish.css?v=1">
</head>
<body class="hw-debug-screen">
  <h1>NPC 档案</h1>

  <div class="toolbar">
    <button id="btn-load">刷新 NPC</button>
    <select id="filter-location">
      <option value="">全部地点</option>
    </select>
    <button id="btn-reset">重置</button>
    <button id="btn-export">导出</button>
    <button id="btn-give-money">+100 金币</button>
    <button id="btn-give-knowledge">+100 知识</button>
  </div>

  <div class="panel">
    <div id="npc-list" class="grid">
      <p>刷新后查看 NPC。</p>
    </div>
  </div>

  <div class="panel">
    <h2>记录</h2>
    <div id="log" class="log"></div>
  </div>

  <div class="panel">
    <h2>进度</h2>
    <div id="progress" class="progress"></div>
  </div>

  <script src="/game/js/core/SaveManager.js"></script>
  <script type="module" src="test-npc-dialogue-main.js"></script>
</body>
</html>
