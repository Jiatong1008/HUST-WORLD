<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成长系统调试 | HUST WORLD</title>
  <style>
    :root {
      --primary: #f59e0b;
      --primary-light: #fbbf24;
      --primary-dark: #d97706;
      --accent: #f97316;
      --bg: #0f172a;
      --bg-gradient-start: #1e1b4b;
      --bg-gradient-end: #0f172a;
      --panel: rgba(255, 255, 255, 0.06);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --font-title: 'STKaiti', 'KaiTi', 'SimKai', 'STSong', 'SongTi SC', serif;
      --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      text-align: center;
      padding: 32px 16px;
      position: relative;
    }
    header h1 {
      font-family: var(--font-title);
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0;
      background: linear-gradient(90deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
    }
    header p { color: var(--text-muted); margin: 8px 0 0; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 24px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(245, 158, 11, 0.15); }
    .card h2 {
      font-family: var(--font-title);
      font-size: 1.4rem;
      margin: 0 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--primary-light);
    }
    .card h2 svg { width: 24px; height: 24px; fill: currentColor; }
    .stat-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .stat-label { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 0.9rem; }
    .stat-value { font-weight: 700; font-size: 1.1rem; }
    .progress-wrap { background: rgba(255,255,255,0.08); height: 10px; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 0.4s ease; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
      transition: transform 0.1s ease, box-shadow 0.2s ease, filter 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover { filter: brightness(1.1); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45); }
    .btn:active { transform: scale(0.96); }
    .btn-secondary { background: rgba(255,255,255,0.1); box-shadow: none; }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .log {
      background: rgba(0,0,0,0.25);
      border-radius: 14px;
      padding: 16px;
      max-height: 320px;
      overflow-y: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .log-entry { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; opacity: 0; animation: fadeIn 0.3s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
    .log-time { color: var(--text-muted); white-space: nowrap; }
    .log-icon { width: 18px; height: 18px; flex-shrink: 0; fill: var(--primary-light); margin-top: 2px; }
    .log-text { color: #e2e8f0; }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(245, 158, 11, 0.15); color: var(--primary-light); font-size: 0.8rem; font-weight: 700; }
    .level-ring { width: 80px; height: 80px; border-radius: 50%; background: conic-gradient(var(--primary) calc(var(--pct) * 1%), rgba(255,255,255,0.08) 0); display: grid; place-items: center; margin: 0 auto 16px; position: relative; }
    .level-ring::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: var(--bg); }
    .level-ring span { position: relative; font-size: 1.5rem; font-weight: 800; color: var(--primary-light); }
    @media (max-width: 600px) { body { padding: 14px; } .grid { grid-template-columns: 1fr; } .btn { width: 100%; justify-content: center; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✦ 成长系统调试 ✦</h1>
      <p>属性、等级、升级与数值平衡测试面板</p>
    </header>

    <div class="grid">
      <div class="card">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          角色状态
        </h2>
        <div class="level-ring" id="level-ring" style="--pct: 0"><span id="level">1</span></div>
        <div class="stat-row"><div class="stat-label">经验</div><div class="stat-value" id="experience">0 / 100</div></div>
        <div class="progress-wrap"><div class="progress-fill" id="exp-bar" style="width: 0%"></div></div>
        <div class="stat-row" style="margin-top: 14px"><div class="stat-label">金币</div><div class="stat-value" id="money">0</div></div>
      </div>

      <div class="card">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          属性详情
        </h2>
        <div class="stat-row"><div class="stat-label">知识</div><div class="stat-value" id="knowledge">0</div></div>
        <div class="progress-wrap"><div class="progress-fill" id="knowledge-bar" style="width: 0%"></div></div>
        <div class="stat-row" style="margin-top: 14px"><div class="stat-label">社交</div><div class="stat-value" id="social">0</div></div>
        <div class="progress-wrap"><div class="progress-fill" id="social-bar" style="width: 0%"></div></div>
        <div class="stat-row" style="margin-top: 14px"><div class="stat-label">体能 / 上限</div><div class="stat-value" id="stamina">100 / 100</div></div>
        <div class="progress-wrap"><div class="progress-fill" id="stamina-bar" style="width: 100%"></div></div>
        <div class="stat-row" style="margin-top: 14px"><div class="stat-label">心情</div><div class="stat-value" id="mood">50</div></div>
        <div class="progress-wrap"><div class="progress-fill" id="mood-bar" style="width: 50%"></div></div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg>
          测试操作
        </h2>
        <div class="btn-group">
          <button class="btn" id="btn-add-exp">+100 经验</button>
          <button class="btn" id="btn-add-money">+50 金币</button>
          <button class="btn" id="btn-add-knowledge">+10 知识</button>
          <button class="btn" id="btn-add-social">+10 社交</button>
          <button class="btn" id="btn-reduce-stamina">-20 体能</button>
          <button class="btn btn-danger" id="btn-reset">重置状态</button>
        </div>
        <div class="btn-group">
          <button class="btn btn-secondary" id="btn-trigger-level-up">模拟连升3级</button>
          <button class="btn btn-secondary" id="btn-apply-package">发放任务奖励包</button>
        </div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM12 18H8v-2h4v2zm4-4H8v-2h8v2zm0-4H8V8h8v2z"/></svg>
          运行日志
        </h2>
        <div class="log" id="log"><div class="log-entry"><div class="log-time">--:--:--</div><div class="log-icon"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg></div><div class="log-text">等待初始化...</div></div></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/game/js/core/SaveManager.js"></script>
  <script type="module">
    import('./test-growth-system-main.js').then(module => {
      const GrowthSystemTest = module.default || module.GrowthSystemTest;
      if (GrowthSystemTest) {
        window.growthTest = new GrowthSystemTest();
      }
    }).catch(err => console.error('加载测试主脚本失败:', err));
  </script>
</body>
</html>
