<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物品系统调试 | HUST WORLD</title>
  <style>
    :root {
      --primary: #06b6d4;
      --primary-light: #22d3ee;
      --primary-dark: #0891b2;
      --accent: #14b8a6;
      --bg: #0f172a;
      --bg-gradient-start: #083344;
      --bg-gradient-end: #0f172a;
      --panel: rgba(255, 255, 255, 0.06);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --font-title: 'STKaiti', 'KaiTi', 'SimKai', 'STSong', 'SongTi SC', serif;
      --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; padding: 32px 16px; }
    header h1 {
      font-family: var(--font-title);
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0;
      background: linear-gradient(90deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
    }
    header p { color: var(--text-muted); margin: 8px 0 0; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 24px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(6, 182, 212, 0.15); }
    .card h2 {
      font-family: var(--font-title);
      font-size: 1.4rem;
      margin: 0 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--primary-light);
    }
    .card h2 svg { width: 24px; height: 24px; fill: currentColor; }
    .stat-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .stat-label { color: var(--text-muted); font-size: 0.9rem; }
    .stat-value { font-weight: 700; font-size: 1.1rem; }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
      transition: transform 0.1s ease, box-shadow 0.2s ease, filter 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover { filter: brightness(1.1); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.45); }
    .btn:active { transform: scale(0.96); }
    .btn-secondary { background: rgba(255,255,255,0.1); box-shadow: none; }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .item-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .item-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(6, 182, 212, 0.2); }
    .item-icon { width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: grid; place-items: center; font-size: 1.4rem; }
    .item-name { font-weight: 700; font-size: 0.95rem; }
    .item-category { color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; }
    .item-qty { color: var(--primary-light); font-weight: 700; margin-top: 8px; }
    .item-usable { font-size: 0.75rem; margin-top: 6px; padding: 2px 8px; border-radius: 999px; display: inline-block; }
    .usable-yes { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .usable-no { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }
    .json-panel {
      background: rgba(0,0,0,0.25);
      border-radius: 14px;
      padding: 16px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.82rem;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      color: #e2e8f0;
    }
    .log {
      background: rgba(0,0,0,0.25);
      border-radius: 14px;
      padding: 16px;
      max-height: 260px;
      overflow-y: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .log-line { margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; }
    .log-time { color: var(--text-muted); white-space: nowrap; }
    .log-icon { width: 18px; height: 18px; fill: var(--primary-light); flex-shrink: 0; margin-top: 2px; }
    .log-text { color: #e2e8f0; }
    .log-ok .log-text { color: #86efac; }
    .log-warn .log-text { color: #fde047; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--primary-light);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
      z-index: 1000;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    @media (max-width: 600px) { body { padding: 14px; } .grid { grid-template-columns: 1fr; } .btn { width: 100%; justify-content: center; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>◈ 物品系统调试 ◈</h1>
      <p>背包、物品、商店与消耗品效果测试面板</p>
    </header>

    <div class="grid">
      <div class="card">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M20 7h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 4h4v3h-4V4z"/></svg>
          角色属性
        </h2>
        <div class="stat-row"><div class="stat-label">金币</div><div class="stat-value" id="moneyValue">0</div></div>
        <div class="stat-row"><div class="stat-label">体能</div><div class="stat-value" id="staminaValue">100</div></div>
        <div class="stat-row"><div class="stat-label">知识</div><div class="stat-value" id="knowledgeValue">50</div></div>
        <div class="stat-row"><div class="stat-label">社交</div><div class="stat-value" id="socialValue">50</div></div>
        <div class="stat-row"><div class="stat-label">心情</div><div class="stat-value" id="moodValue">50</div></div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
          背包物品
        </h2>
        <div class="inventory-grid" id="inventoryList">
          <div class="item-card">
            <div class="item-icon">🎒</div>
            <div class="item-name">背包为空</div>
            <div class="item-category">等待添加物品</div>
          </div>
        </div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg>
          测试操作
        </h2>
        <div class="btn-group">
          <button class="btn" onclick="window.addCoffee()">+ coffee</button>
          <button class="btn" onclick="window.addStudyNotes()">+ study_notes</button>
          <button class="btn" onclick="window.addLabRecord()">+ lab_record</button>
          <button class="btn" onclick="window.useCoffee()">使用 coffee</button>
          <button class="btn" onclick="window.useSportsDrink()">使用 sports_drink</button>
          <button class="btn" onclick="window.removeCoffee()">移除 coffee</button>
          <button class="btn btn-secondary" onclick="window.simulateQuestReward()">模拟任务奖励</button>
          <button class="btn btn-secondary" onclick="window.simulateShopPurchase()">模拟商店购买</button>
          <button class="btn btn-secondary" onclick="window.saveAndRefresh()">保存并重载</button>
          <button class="btn btn-danger" onclick="window.resetInventory()">重置背包</button>
        </div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM12 18H8v-2h4v2zm4-4H8v-2h8v2zm0-4H8V8h8v2z"/></svg>
          存档 JSON
        </h2>
        <div class="json-panel" id="inventoryJsonPanel">{}</div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM12 18H8v-2h4v2zm4-4H8v-2h8v2zm0-4H8V8h8v2z"/></svg>
          运行日志
        </h2>
        <div class="log" id="logPanel">
          <div class="log-line log-ok">
            <div class="log-time">--:--:--</div>
            <div class="log-icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="log-text">物品系统调试页已初始化</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/game/js/core/SaveManager.js"></script>
  <script type="module" src="./test-inventory-system-main.js"></script>
</body>
</html>
