<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏主界面测试 | HUST WORLD</title>
  <link rel="stylesheet" href="/game/css/ui-theme.css">
  <link rel="stylesheet" href="/game/css/game-dashboard.css">
  <link rel="stylesheet" href="/game/css/gameplay-panels.css">
  <link rel="stylesheet" href="/game/css/responsive-motion.css">
  <style>
    :root { --bg: #0b0f19; --text: #f8fafc; --muted: #94a3b8; }
    body { margin: 0; font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; }
    #test-status { position: fixed; top: 12px; left: 12px; right: 12px; padding: 12px 16px; border-radius: 10px; z-index: 90000; font-weight: 700; }
    #test-status.pending { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
    #test-status.success { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
    #test-status.error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    #test-log { position: fixed; top: 72px; left: 12px; right: 12px; bottom: 12px; overflow-y: auto; background: rgba(0,0,0,0.25); border-radius: 10px; padding: 16px; font-family: Consolas, Monaco, monospace; font-size: 13px; line-height: 1.6; }
    .log-line { margin-bottom: 6px; }
    .log-pass { color: #86efac; }
    .log-fail { color: #fca5a5; }
    .log-info { color: #93c5fd; }
  </style>
  <link rel="stylesheet" href="/game/css/cinematic-polish.css?v=1">
</head>
<body class="hw-debug-screen">
  <div id="test-status" class="pending">⏳ 测试运行中...</div>
  <div id="test-log"></div>

  <script src="/game/js/core/SaveManager.js"></script>
  <script type="module">
    import('./test-game-dashboard-main.js').then(module => {
      const TestGameDashboard = module.default || module.TestGameDashboard;
      if (TestGameDashboard) {
        window.dashboardTest = new TestGameDashboard();
        window.dashboardTest.run();
      } else {
        document.getElementById('test-status').textContent = '❌ 未找到测试入口';
        document.getElementById('test-status').className = 'error';
      }
    }).catch(err => {
      document.getElementById('test-status').textContent = '❌ 加载测试脚本失败: ' + err.message;
      document.getElementById('test-status').className = 'error';
      console.error(err);
    });
  </script>
</body>
</html>
