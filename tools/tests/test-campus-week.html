<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喻园第一周测试 | HUST WORLD Personal</title>
  <link rel="stylesheet" href="/game/css/ui-theme.css">
  <link rel="stylesheet" href="/game/css/campus-week.css">
  <style>
    body { margin: 0; min-height: 100vh; color: #eaf0e9; background: #102126; font-family: "Microsoft YaHei", sans-serif; }
    #test-status { position: fixed; z-index: 70000; top: 12px; left: 12px; right: 12px; padding: 12px 16px; border-radius: 10px; background: rgba(59,130,246,.24); }
    #test-status.success { background: rgba(34,197,94,.23); } #test-status.error { background: rgba(239,68,68,.25); }
    #test-log { position: fixed; z-index: 70000; top: 62px; left: 12px; width: min(480px, calc(100vw - 24px)); max-height: 40vh; overflow: auto; padding: 12px; box-sizing: border-box; border-radius: 10px; background: rgba(0,0,0,.38); font: 12px/1.7 Consolas, monospace; }
    .pass { color: #a7f3d0; } .fail { color: #fecaca; }
  </style>
</head>
<body>
  <div id="test-status">⏳ 喻园第一周自动化测试运行中…</div>
  <div id="test-log"></div>
  <script src="/game/js/core/SaveManager.js"></script>
  <script src="/game/js/features/CampusWeekManager.js"></script>
  <script type="module" src="/tools/tests/test-campus-week-main.js"></script>
</body>
</html>
