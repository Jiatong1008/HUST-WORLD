<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务日志 | HUST WORLD</title>
  <style>
    :root {
      --gold: #FFD700;
      --bg: #0a0c18;
      --panel: #12142a;
      --border: rgba(255, 215, 0, 0.2);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --club: #f59e0b;
      --running: #10b981;
      --exploration: #3b82f6;
      --activity: #ec4899;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Microsoft YaHei', sans-serif;
      line-height: 1.6;
    }
    h1 { color: var(--gold); margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
    }
    @media (max-width: 1024px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .panel h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: var(--gold);
      display: flex; align-items: center; gap: 8px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      margin: 4px 4px 4px 0;
    }
    .btn:hover { background: rgba(255,215,0,0.1); border-color: var(--gold); transform: translateY(-1px); }
    .btn-success { border-color: rgba(34,197,94,0.4); color: var(--success); }
    .btn-danger { border-color: rgba(239,68,68,0.4); color: var(--danger); }
    .btn-warning { border-color: rgba(245,158,11,0.4); color: var(--warning); }
    .btn-info { border-color: rgba(59,130,246,0.4); color: var(--info); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .field {
      display: flex; align-items: center; gap: 10px; margin: 10px 0;
      flex-wrap: wrap;
    }
    .field label { color: var(--muted); font-size: 13px; min-width: 70px; }
    input, select, textarea {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 14px;
      min-width: 180px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
    .log {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 12px;
      max-height: 320px;
      overflow: auto;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 6px;
    }
    .tag-AVAILABLE { background: rgba(34,197,94,0.15); color: var(--success); }
    .tag-ACTIVE { background: rgba(233,30,99,0.15); color: #f472b6; }
    .tag-COMPLETED { background: rgba(255,215,0,0.15); color: var(--gold); }
    .tag-LOCKED { background: rgba(158,158,158,0.15); color: var(--muted); }
    .tag-PREREQ_MET { background: rgba(255,152,0,0.15); color: var(--warning); }
    .tag-LOCATION_REACHED { background: rgba(33,150,243,0.15); color: var(--info); }
    .tag-READY_TO_COMPLETE { background: rgba(139,92,246,0.15); color: #a78bfa; }
    .quest-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 8px 0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quest-card:hover { border-color: var(--gold); background: rgba(255,255,255,0.05); }
    .quest-card.selected { border-color: var(--gold); background: rgba(255,215,0,0.08); }
    .quest-card h3 { margin: 0 0 6px 0; font-size: 15px; }
    .quest-card small { color: var(--muted); font-size: 12px; }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), #FFA500); border-radius: 3px; }
    .status-line { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .mono { font-family: monospace; }
    .snapshot {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      max-height: 240px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .detail-section { margin: 12px 0; }
    .detail-section h4 { margin: 0 0 8px 0; color: var(--gold); font-size: 14px; }
    .run-step { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .run-step:last-child { border-bottom: none; }
    .step-ok { color: var(--success); }
    .step-fail { color: var(--danger); }
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 10px;
      background: rgba(20, 22, 40, 0.98);
      border-left: 3px solid var(--gold);
      color: #fff;
      z-index: 10000;
      font-size: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.3s, top 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; top: 30px; }
    .category-club { color: var(--club); }
    .category-running { color: var(--running); }
    .category-exploration { color: var(--exploration); }
    .category-activity { color: var(--activity); }
    .category-main { color: var(--gold); }
    .category-side { color: #60a5fa; }
  </style>
  <link rel="stylesheet" href="/game/css/ui-theme.css?v=1">
  <link rel="stylesheet" href="/game/css/responsive-motion.css?v=1">
  <link rel="stylesheet" href="/game/css/cinematic-polish.css?v=1">
</head>
<body class="hw-debug-screen">
  <h1>任务日志</h1>
  <div class="subtitle">主线 / 支线 / 追踪</div>

  <div id="toast" class="toast"></div>

  <div class="grid">
    <div class="panel">
      <h2>🛠️ 工具栏</h2>
      <div class="field">
        <label>分类过滤</label>
        <select id="categoryFilter">
          <option value="all">全部</option>
          <option value="main">主线</option>
          <option value="side">支线</option>
          <option value="club">社团</option>
          <option value="running">跑步</option>
          <option value="exploration">探索</option>
          <option value="activity">活动</option>
        </select>
      </div>
      <div>
        <button class="btn btn-info" id="btnLoadQuests">刷新</button>
        <button class="btn btn-danger" id="btnResetQuestSystem">重置</button>
        <button class="btn btn-success" id="btnExportProgress">导出</button>
      </div>
      <div>
        <button class="btn btn-warning" id="btnAddGold">+100 金币</button>
        <button class="btn btn-warning" id="btnAddKnowledge">+100 知识</button>
      </div>
      <div>
        <button class="btn btn-info" id="btnSimNpcTalk">模拟 NPC 对话</button>
        <button class="btn btn-info" id="btnSimPoi">模拟 POI 触发</button>
      </div>
      <div class="status-line" style="margin-top:12px;">任务系统已就绪</div>
    </div>

    <div class="panel">
      <h2>📊 当前状态</h2>
      <div id="statusPanel">未初始化</div>
    </div>

    <div class="panel" style="grid-row: span 2;">
      <h2>📋 任务列表</h2>
      <div id="questListPanel" class="log" style="max-height: 560px;">暂无任务</div>
    </div>

    <div class="panel">
      <h2>🔍 任务详情</h2>
      <div id="questDetailPanel">点击左侧任务卡片查看详情</div>
    </div>

    <div class="panel">
      <h2>🎯 当前追踪任务</h2>
      <div id="trackedQuestPanel">无</div>
    </div>

    <div class="panel" style="grid-column: 1 / -1;">
      <h2>记录</h2>
      <div id="debugLog" class="log"></div>
    </div>

    <div class="panel" style="grid-column: 1 / -1;">
      <h2>进度</h2>
      <div id="progressJsonPanel" class="snapshot">暂无</div>
    </div>
  </div>

  <script src="/game/js/core/SaveManager.js"></script>
  <script src="/game/js/config/TimeEvents.js"></script>
  <script src="/game/js/systems/TimeSystem.js"></script>
  <script type="module" src="test-quest-system-main.js"></script>
</body>
</html>
