<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技能系统调试 | HUST WORLD</title>
  <style>
    :root {
      --primary: #a855f7;
      --primary-light: #c084fc;
      --primary-dark: #7e22ce;
      --accent: #ec4899;
      --bg: #0f172a;
      --bg-gradient-start: #2e1065;
      --bg-gradient-end: #0f172a;
      --panel: rgba(255, 255, 255, 0.06);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --font-title: 'STKaiti', 'KaiTi', 'SimKai', 'STSong', 'SongTi SC', serif;
      --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; padding: 32px 16px; }
    header h1 {
      font-family: var(--font-title);
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0;
      background: linear-gradient(90deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
    }
    header p { color: var(--text-muted); margin: 8px 0 0; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 24px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(168, 85, 247, 0.15); }
    .card h2 {
      font-family: var(--font-title);
      font-size: 1.4rem;
      margin: 0 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--primary-light);
    }
    .card h2 svg { width: 24px; height: 24px; fill: currentColor; }
    .stat-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .stat-label { color: var(--text-muted); font-size: 0.9rem; }
    .stat-value { font-weight: 800; font-size: 1.2rem; color: var(--primary-light); }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
      transition: transform 0.1s ease, box-shadow 0.2s ease, filter 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover { filter: brightness(1.1); box-shadow: 0 6px 20px rgba(168, 85, 247, 0.45); }
    .btn:active { transform: scale(0.96); }
    .btn-secondary { background: rgba(255,255,255,0.1); box-shadow: none; }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .skill-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .skill-card:hover { transform: translateY(-2px); box-shadow: 0 4px 18px rgba(168, 85, 247, 0.2); }
    .skill-card.locked { opacity: 0.6; filter: grayscale(0.5); }
    .skill-header { display: flex; justify-content: space-between; align-items: center; }
    .skill-name { font-weight: 800; font-size: 1rem; }
    .skill-status { font-size: 0.75rem; padding: 3px 10px; border-radius: 999px; font-weight: 700; }
    .skill-status.unlocked { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .skill-status.locked { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }
    .skill-level { font-size: 0.85rem; color: var(--text-muted); }
    .skill-exp-line { font-size: 0.8rem; color: var(--text-muted); text-align: right; }
    .progress-wrap { background: rgba(255,255,255,0.08); height: 8px; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 0.4s ease; }
    .json-panel {
      background: rgba(0,0,0,0.25);
      border-radius: 14px;
      padding: 16px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.82rem;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      color: #e2e8f0;
    }
    .log {
      background: rgba(0,0,0,0.25);
      border-radius: 14px;
      padding: 16px;
      max-height: 260px;
      overflow-y: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .log-entry { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
    .log-time { color: var(--text-muted); white-space: nowrap; }
    .log-icon { width: 18px; height: 18px; flex-shrink: 0; fill: var(--primary-light); margin-top: 2px; }
    .log-text { color: #e2e8f0; }
    .log-info .log-text { color: #c084fc; }
    .log-warn .log-text { color: #fde047; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--primary-light);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
      z-index: 1000;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    @media (max-width: 600px) { body { padding: 14px; } .grid { grid-template-columns: 1fr; } .btn { width: 100%; justify-content: center; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✧ 技能系统调试 ✧</h1>
      <p>技能解锁、熟练度与经验加成测试面板</p>
    </header>

    <div class="grid">
      <div class="card" style="grid-column: 1 / -1;">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          技能加成总览
        </h2>
        <div class="grid" style="margin-top: 0;">
          <div class="stat-row"><div class="stat-label">考试加成</div><div class="stat-value" id="examBonusValue">0.00</div></div>
          <div class="stat-row"><div class="stat-label">跑步加成</div><div class="stat-value" id="runningBonusValue">0.00</div></div>
          <div class="stat-row"><div class="stat-label">社交加成</div><div class="stat-value" id="socialBonusValue">0.00</div></div>
          <div class="stat-row"><div class="stat-label">探索加成</div><div class="stat-value" id="explorationBonusValue">0.00</div></div>
        </div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          技能列表
        </h2>
        <div class="skill-grid" id="skillList">
          <div class="skill-card locked">
            <div class="skill-header"><div class="skill-name">加载中...</div><div class="skill-status locked">未解锁</div></div>
            <div class="skill-level">等级 -/-</div>
            <div class="progress-wrap"><div class="progress-fill" style="width:0%"></div></div>
          </div>
        </div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg>
          测试操作
        </h2>
        <div class="btn-group">
          <button class="btn" onclick="window.unlockMathFocus()">解锁 数学专注</button>
          <button class="btn" onclick="window.unlockLibraryResearch()">解锁 图书馆研究</button>
          <button class="btn" onclick="window.unlockEnduranceTraining()">解锁 耐力训练</button>
          <button class="btn" onclick="window.unlockCampusObservation()">解锁 校园观察</button>
          <button class="btn" onclick="window.addMathFocusExp()">数学专注 +100 经验</button>
          <button class="btn" onclick="window.levelUpMathFocus()">数学专注 升级</button>
          <button class="btn btn-secondary" onclick="window.simulateStudyQuest()">模拟学习任务</button>
          <button class="btn btn-secondary" onclick="window.simulateExamQuest()">模拟考试任务</button>
          <button class="btn btn-secondary" onclick="window.simulateRunQuest()">模拟跑步任务</button>
          <button class="btn btn-secondary" onclick="window.simulateClubQuest()">模拟社团任务</button>
          <button class="btn btn-secondary" onclick="window.simulateExploreQuest()">模拟探索任务</button>
          <button class="btn btn-secondary" onclick="window.showSkillSummary()">显示加成汇总</button>
          <button class="btn btn-secondary" onclick="window.saveAndRefresh()">保存并重载</button>
          <button class="btn btn-danger" onclick="window.resetSkills()">重置技能</button>
        </div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM12 18H8v-2h4v2zm4-4H8v-2h8v2zm0-4H8V8h8v2z"/></svg>
          存档 JSON
        </h2>
        <div class="json-panel" id="skillsJsonPanel">{}</div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM12 18H8v-2h4v2zm4-4H8v-2h8v2zm0-4H8V8h8v2z"/></svg>
          运行日志
        </h2>
        <div class="log" id="log">
          <div class="log-entry">
            <div class="log-time">--:--:--</div>
            <div class="log-icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
            <div class="log-text">技能与熟练度调试页已初始化</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/game/js/core/SaveManager.js"></script>
  <script type="module" src="./test-skills-system-main.js"></script>
</body>
</html>
